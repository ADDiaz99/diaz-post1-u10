# sonar-project.properties
# OJO: este archivo lo lee el SonarScanner de línea de comandos (sonar-scanner).
# El análisis de este proyecto se hace con "mvn sonar:sonar" (SonarScanner for Maven),
# que toma su configuración del pom.xml, no de aquí. Por eso las mismas propiedades
# están repetidas en la sección <properties> del pom.xml.
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.host.url=http://localhost:9000
sonar.qualitygate.wait=false
